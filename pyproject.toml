[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supply-response"
version = "0.1.0"
description = "Portable core for the Supply Response prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-framework-core>=1,<2",
  "agent-framework-foundry>=1,<2",
  "alembic>=1.16,<2",
  "azure-ai-projects>=2.3,<3",
  "azure-identity>=1.23,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "msal>=1.32,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyodbc>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
]
fabric-deploy = [
  "fabric-cicd==1.3.0; python_version == '3.12'",
  "jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "data", "integrations", "agents"]

[tool.hatch.build.targets.wheel.force-include]
"fabric/sql/001_operational_schema.sql" = "fabric/sql/001_operational_schema.sql"
"fabric/sql/002_analytics_views.sql" = "fabric/sql/002_analytics_views.sql"
"fabric/sql/003_reporting_dataset.sql" = "fabric/sql/003_reporting_dataset.sql"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "fabric_live: requires an explicitly configured live Fabric SQL Database",
  "power_bi_live: requires explicit API and Power BI live settings",
  "workiq_live: legacy A2A adapter check only; not production MCP acceptance",
  "foundry_live: requires explicit pinned Foundry agent settings and separate approval",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "pip-audit>=2.9,<3",
    "pyright>=1.1.400,<2",
    "ruff>=0.12,<1",
]
